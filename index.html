<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176b45" />
    <title>Mau Kemana?</title>
    <style>
      :root {
        color-scheme: light;
        --green: #176b45;
        --green-dark: #104d33;
        --green-soft: #e8f4ec;
        --ink: #17241c;
        --muted: #64736a;
        --line: #dce7de;
        --paper: #f7faf7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background-color: var(--paper);
        background-image: radial-gradient(#c9ddcd 0.8px, transparent 0.8px);
        background-size: 22px 22px;
        font-family: 'Segoe UI', sans-serif;
      }

      .page {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 48px 20px;
      }

      .directory {
        width: min(100%, 620px);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(23 61 38 / 9%);
        animation: arrive 500ms ease-out both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 18px;
        color: var(--green);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #57a66d;
        content: '';
      }

      .title {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(2.8rem, 11vw, 4.5rem);
        font-weight: 500;
        line-height: 0.98;
        color: var(--green-dark);
      }

      .intro {
        margin: 12px 0 24px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .app-list {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .app-link {
        display: flex;
        min-height: 92px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 8px 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
        transition:
          border-color 180ms ease,
          background-color 180ms ease,
          transform 180ms ease;
      }

      .app-link:hover {
        transform: translateY(-2px);
        border-color: #9dc5a7;
        background-color: #fbfefb;
      }

      .app-link:focus-visible {
        outline: 3px solid #8fc49c;
        outline-offset: 3px;
      }

      .app-name {
        display: block;
        margin-bottom: 4px;
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--green);
      }

      .app-caption {
        display: block;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .app-arrow {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: var(--green-soft);
        color: var(--green-dark);
        font-size: 1.2rem;
        transition:
          background-color 180ms ease,
          color 180ms ease;
      }

      .app-link:hover .app-arrow {
        background: var(--green);
        color: #fff;
      }

      .footer {
        margin: 28px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="directory" aria-labelledby="page-title">
        <p class="eyebrow">Portal ID Santri</p>
        <h1 class="title" id="page-title">Mau Kemana?</h1>
        <p class="intro">Pilih aplikasi demo yang ingin kamu buka.</p>

        <ul class="app-list">
          <li class="app-item">
            <a
              class="app-link"
              href="https://idsantri-admin.netlify.app"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="app-details">
                <span class="app-name">ID Santri Admin</span>
                <span class="app-caption">DEMO Aplikasi Pengurus</span>
              </span>
              <span class="app-arrow" aria-hidden="true">&#8599;</span>
            </a>
          </li>
          <li class="app-item">
            <a
              class="app-link"
              href="https://idsantri-wali.netlify.app"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="app-details">
                <span class="app-name">ID Santri Wali</span>
                <span class="app-caption">DEMO Aplikasi Wali Santri</span>
              </span>
              <span class="app-arrow" aria-hidden="true">&#8599;</span>
            </a>
          </li>
        </ul>

        <p class="footer"><em>Pilih tujuanmu untuk melanjutkan!</em></p>
      </section>
    </main>
  </body>
</html>
